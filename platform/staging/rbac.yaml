# =============================================================================
# File        : platform/staging/rbac.yaml
# Assignment  : DSO202 Assignment 4 (from Assignment 1 Task 8, as used in Assignment 2)
# Descriptor  : Unit II 2.3 - RBAC; Unit IV 4.3.1
# Purpose     : A read-only ServiceAccount for the staging namespace. Kubernetes
#               RBAC objects belong to the platform layer (chart requirement C8):
#               the dso202 AppProject is not allowed to create them.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-viewer
  namespace: dso202-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly-role
  namespace: dso202-staging
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    # statefulsets added in Assignment 4: the database tier is a StatefulSet.
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-binding
  namespace: dso202-staging
subjects:
  - kind: ServiceAccount
    name: readonly-viewer
    namespace: dso202-staging
roleRef:
  kind: Role
  name: readonly-role
  apiGroup: rbac.authorization.k8s.io
