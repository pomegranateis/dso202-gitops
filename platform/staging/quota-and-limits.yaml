# =============================================================================
# File        : platform/staging/quota-and-limits.yaml
# Assignment  : DSO202 Assignment 4 (values from Assignment 1 Task 6, as used in Assignment 2)
# Descriptor  : Unit I 1.5.3 - ResourceQuota and LimitRange; Unit IV 4.3.1
# Purpose     : Caps what the staging namespace may consume, and gives containers
#               default requests and limits. Delivered by the platform-staging
#               Application, so the workload project (dso202) cannot change it.
#               Because this quota covers requests and limits, every container
#               in the namespace must declare both (chart requirement C7).
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: assignment-quota
  namespace: dso202-staging
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: "1.5Gi"
    limits.cpu: "3000m"
    limits.memory: "3Gi"
    pods: "10"
---
# Defaults injected at admission for any container that omits resources,
# and the per-container minimum and maximum.
apiVersion: v1
kind: LimitRange
metadata:
  name: assignment-limitrange
  namespace: dso202-staging
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "500m"
        memory: "512Mi"
      min:
        cpu: "50m"
        memory: "64Mi"
