# =============================================================================
# File        : platform/dev/tasktracker-credentials.sealed.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.1; Unit I 1.5.1 - Secrets (encrypted with Sealed Secrets)
# Purpose     : The database credentials for dev, encrypted by kubeseal with the
#               public key of this cluster's Sealed Secrets controller. Safe to
#               commit: only that controller can decrypt it. Generated with:
#                 kubectl create secret generic tasktracker-credentials \
#                   --namespace dso202-dev --from-env-file=secrets-plain/dev.env \
#                   --dry-run=client -o yaml | kubeseal --format yaml
#               Strict scope (the default): the name and the namespace are part
#               of what is encrypted, so this file cannot be decrypted under
#               another name or in another namespace. The body below is left
#               exactly as kubeseal generated it.
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasktracker-credentials
  namespace: dso202-dev
spec:
  encryptedData:
    DB_PASSWORD: 
    DB_USER: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: tasktracker-credentials
      namespace: dso202-dev
