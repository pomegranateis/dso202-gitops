# =============================================================================
# File        : argocd/projects/dso202.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.4.1 - AppProjects: source and destination rules
# Purpose     : The workload project. It confines the Task Tracker Applications
#               to one repository, two namespaces, and an explicit list of
#               resource kinds. A manifest outside these limits is rejected at
#               sync time, whoever committed it.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dso202
  namespace: argocd
  annotations:
    # Wave -3: the project must exist before any Application that refers to it.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Task Tracker workloads for the dev and staging environments

  sourceRepos:
    - https://github.com/pomegranateis/dso202-gitops.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: dso202-dev
    - server: https://kubernetes.default.svc
      namespace: dso202-staging

  # An empty list permits no cluster-scoped kinds at all: this project cannot
  # create namespaces, ClusterRoles, or CustomResourceDefinitions.
  clusterResourceWhitelist: []

  # Only these namespaced kinds may be deployed. The list is built from the
  # output of 'helm template' (Task 3) and must name exactly the kinds the chart
  # renders, including the Job used as a hook. ResourceQuota, LimitRange, Role,
  # RoleBinding, and SealedSecret are absent on purpose: they belong to the
  # platform layer, so the workload project cannot loosen its own limits.
  #
  # Verified against 'helm template' for both environments (Task 1, step 6):
  # ConfigMap x3, Deployment x2, Service x3, StatefulSet x1, plus the Job
  # added in Task 5. Changes from Listing 8:
  #   - ServiceAccount removed: this chart renders none. The read-only
  #     ServiceAccount from Assignment 2 is in platform/<env>/rbac.yaml.
  #   - PersistentVolumeClaim not added: the database PVC comes from the
  #     StatefulSet's volumeClaimTemplates and is created by the StatefulSet
  #     controller, not by Argo CD.
  #   - ReplicaSet and Pod added (Task 6): the chart does not render them, but
  #     Argo CD leaves kinds that are not permitted out of an Application's
  #     resource tree, so without them the controller-created ReplicaSets and
  #     Pods were invisible and no Pod logs could be served, even to admin.
  #     This does not widen what a commit can do: Deployment is already
  #     permitted, and a Deployment can run any Pod.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: batch
      kind: Job
    # Not rendered by the chart; listed so Argo CD can show them and their logs.
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
