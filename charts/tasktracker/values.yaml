# =============================================================================
# File        : charts/tasktracker/values.yaml
# Assignment  : DSO202 Assignment 4 (chart from Assignment 3, adjusted for GitOps)
# Descriptor  : Unit III 3.2 - Helm values; Unit IV 4.3 - delivery by Argo CD
# Purpose     : Defaults only. Everything that differs between dev and staging
#               lives in environments/<env>/values.yaml, so the chart itself is
#               identical in both environments (design rule 2).
# =============================================================================

# Required: dev or staging. No default on purpose, so the chart refuses to
# render until an environment is chosen (enforced in values.schema.json).
environment: ""

# Never 'Always': images may be loaded into kind from the host (brief section 13).
imagePullPolicy: IfNotPresent

# C3: the chart never renders a Secret. Pods read the database credentials
# (DB_USER, DB_PASSWORD, POSTGRES_USER, POSTGRES_PASSWORD) from this existing
# Secret, which the Sealed Secrets controller creates in the namespace.
existingSecret: tasktracker-credentials

# -----------------------------------------------------------------------------
# Database tier (StatefulSet, as in Assignment 2)
# -----------------------------------------------------------------------------
database:
  # C1: repository and tag are values; no tag is written in a template.
  image:
    repository: sarojsanyasi/dso202-db
    tag: "1.0"
  # C2: rendered into the database-config ConfigMap. Adding a variable here
  # needs no template change.
  env:
    POSTGRES_DB: taskdb
  storage: 1Gi
  storageClass: standard
  # C7: required by the namespace ResourceQuota (platform/<env>/quota-and-limits.yaml).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------------
# Backend tier (Deployment)
# -----------------------------------------------------------------------------
backend:
  image:
    repository: sarojsanyasi/dso202-backend
    tag: "1.0"
  replicaCount: 1
  env:
    DB_HOST: db-svc
    DB_PORT: "5432"
    DB_NAME: taskdb
    APP_PORT: "8080"
    CORS_ORIGIN: "*"
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 384Mi

# -----------------------------------------------------------------------------
# Frontend tier (Deployment)
# -----------------------------------------------------------------------------
frontend:
  image:
    repository: sarojsanyasi/dso202-frontend
    tag: "1.0"
  replicaCount: 1
  env:
    # The browser calls this address directly (the frontend does not proxy
    # /api). The default is the cluster-internal name from Assignment 1; each
    # environment overrides it with an address the browser can reach.
    BACKEND_URL: http://backend-svc:8080
  # C10: NodePort, with the port number as a value.
  service:
    type: NodePort
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# C9: no ingress controller is installed in this assignment, so the Ingress
# template from Assignment 3 is disabled by default.
ingress:
  enabled: false
  className: nginx
  host: ""
