# =============================================================================
# File        : charts/tasktracker/templates/ingress.yaml
# Assignment  : DSO202 Assignment 4 (from Assignment 3)
# Descriptor  : Unit II 2.2 - Ingress
# Purpose     : Kept from Assignment 3 but disabled by default (C9): no ingress
#               controller is installed in this assignment, and Ingress is not
#               in the dso202 project whitelist. Nothing renders unless
#               ingress.enabled is true.
# =============================================================================
{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled is true" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasktracker-ingress
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 8080
{{- end }}
