# =============================================================================
# File        : charts/tasktracker/templates/backend.yaml
# Assignment  : DSO202 Assignment 4 (from Assignment 3, adjusted for GitOps)
# Descriptor  : Unit I 1.2 - Deployments and Services; Unit IV 4.3.2, 4.3.3
# Purpose     : The REST API and its ClusterIP Service (backend-svc). The
#               Service name is the one the smoke test calls.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: backend
  annotations:
    # C5: wave 1 - applied after the database is Healthy.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # C6: report a stuck rollout after 2 minutes instead of the default 10, so
  # Argo CD marks the Application Degraded quickly (Task 7).
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" (dict "root" . "tier" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: backend
      annotations:
        {{- include "tasktracker.configChecksum" (dict "root" . "tier" "backend" "env" .Values.backend.env) | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ include "tasktracker.image" .Values.backend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          # C4: GET /api/status, as the brief specifies.
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          # C7
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: backend
spec:
  type: ClusterIP
  selector:
    {{- include "tasktracker.selectorLabels" (dict "root" . "tier" "backend") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
