# =============================================================================
# File        : charts/tasktracker/templates/database.yaml
# Assignment  : DSO202 Assignment 4 (StatefulSet from Assignment 2)
# Descriptor  : Unit II 2.1 - StatefulSets; Unit IV 4.3.2 - sync waves
# Purpose     : PostgreSQL as a one-replica StatefulSet with its own volume, and
#               the headless Service that gives it a stable DNS name (db-svc).
# Note        : The PersistentVolumeClaim comes from volumeClaimTemplates, so it
#               is created by the StatefulSet controller, not by Argo CD. It is
#               not tracked and survives deletion of the Application.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: db-svc
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: database
spec:
  clusterIP: None
  selector:
    {{- include "tasktracker.selectorLabels" (dict "root" . "tier" "database") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-statefulset
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: database
  annotations:
    # C5: wave 0 - the database is applied first. Argo CD waits for it to be
    # Healthy (readiness probe passing) before applying wave 1, the backend.
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: db-svc
  replicas: 1
  # RollingUpdate, not OnDelete: Argo CD does not report an OnDelete
  # StatefulSet as Healthy (brief section 13).
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" (dict "root" . "tier" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: database
      annotations:
        {{- include "tasktracker.configChecksum" (dict "root" . "tier" "database" "env" .Values.database.env) | nindent 8 }}
    spec:
      containers:
        - name: db
          image: {{ include "tasktracker.image" .Values.database }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: database-config
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          # C4: ready only when PostgreSQL accepts connections. The image runs
          # under emulation on x86_64 hosts, so start-up is given extra time.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # C7
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.database.storageClass }}
        resources:
          requests:
            storage: {{ .Values.database.storage }}
