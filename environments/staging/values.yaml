# =============================================================================
# File        : environments/staging/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - values per environment; Unit IV 4.3.1
# Purpose     : Everything that differs in staging from charts/tasktracker/values.yaml.
#               Read by argocd/applications/tasktracker-staging.yaml from a Git
#               tag, so an edit here reaches staging only after a new tag is
#               promoted and synchronised by hand.
# =============================================================================
environment: staging

database:
  image:
    tag: "1.0"
backend:
  image:
    tag: "1.0"
  replicaCount: 1
  # Backend release 1.2.0 (Task 7, part B), fixed forward: per-environment
  # settings. 982fb28 set DB_PORT to 5433 and was reverted (40cc33b);
  # PostgreSQL listens on 5432.
  env:
    # Only this environment's UI may call the API (the chart default is "*").
    CORS_ORIGIN: http://localhost:8081
    DB_PORT: "5432"
frontend:
  image:
    tag: "1.0"
  # Frontend release 1.1.0 (Task 7, part A). The issued 1.1 image does not
  # exist, so the release is a values change on the 1.0 image: two replicas
  # for availability, and a release marker visible in the Pods' environment.
  replicaCount: 2
  # 30081 is not mapped by the kind configuration; staging is reached with:
  #   kubectl -n dso202-staging port-forward svc/frontend-svc 8081:8080
  service:
    nodePort: 30081
  env:
    RELEASE: "1.1.0"
    #   kubectl -n dso202-staging port-forward svc/backend-svc 8091:8080
    BACKEND_URL: http://localhost:8091

existingSecret: tasktracker-credentials
