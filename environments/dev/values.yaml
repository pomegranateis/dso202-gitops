# =============================================================================
# File        : environments/dev/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - values per environment; Unit IV 4.3.1
# Purpose     : Everything that differs in dev from charts/tasktracker/values.yaml.
#               Read by argocd/applications/tasktracker-dev.yaml from branch main.
# =============================================================================
environment: dev

# Baseline release (images issued for Assignments 1-3). Task 7 changes these.
database:
  image:
    tag: "1.0"
backend:
  image:
    tag: "1.0"
  # One replica per tier to conserve memory (brief Task 1, step 5).
  replicaCount: 1
  # Backend release 1.2.0 (Task 7, part B), fixed forward: per-environment
  # settings. 982fb28 set DB_PORT to 5433 and was reverted (40cc33b);
  # PostgreSQL listens on 5432.
  env:
    # Only this environment's UI may call the API (the chart default is "*").
    CORS_ORIGIN: http://localhost:30080
    DB_PORT: "5432"
frontend:
  image:
    tag: "1.0"
  # Frontend release 1.1.0 (Task 7, part A). The issued 1.1 image does not
  # exist, so the release is a values change on the 1.0 image: two replicas
  # for availability, and a release marker visible in the Pods' environment.
  replicaCount: 2
  # Reached on the host at http://localhost:30080 (mapped in cluster/kind-cluster.yaml).
  service:
    nodePort: 30080
  env:
    RELEASE: "1.1.0"
    # The browser calls the API here. Make it reachable with:
    #   kubectl -n dso202-dev port-forward svc/backend-svc 8090:8080
    BACKEND_URL: http://localhost:8090

# Created in the namespace by the Sealed Secrets controller from
# platform/dev/tasktracker-credentials.sealed.yaml (C3).
existingSecret: tasktracker-credentials
